[package]
name = "dsh-fasttool-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Read-only grep, glob, and inspection extracted from FastCtx"

[features]
default = ["pdf"]
pdf = ["dep:pdfium-render"]

[dependencies]
base64 = "0.22.1"
bpe-openai = "0.3.0"
chardetng = "1.0.0"
dunce = "1.0.5"
encoding_rs = "0.8.35"
fs2 = "0.4.3"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
hex = "0.4.3"
ignore = "0.4.28"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
parking_lot = "0.12.5"
pdfium-render = { version = "=0.9.2", optional = true, default-features = false, features = ["image_025", "pdfium_7763", "thread_safe"] }
rayon = "1.11.0"
rmcp = { version = "=2.2.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
strsim = "0.11.1"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tempfile = "3.23.0"
time = { version = "0.3.53", features = ["formatting", "macros", "parsing"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[build-dependencies]
flate2 = "1.1.5"
hex = "0.4.3"
sha2 = "0.10.9"
tar = "0.4.44"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[dev-dependencies]
filetime = "0.2.26"
tiktoken-rs = "0.12.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
